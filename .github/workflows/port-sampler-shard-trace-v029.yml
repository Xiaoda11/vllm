name: port-sampler-shard-trace-v029

on:
  push:
    branches:
      - port/scheduler-trace-v029
    paths:
      - .github/workflows/port-sampler-shard-trace-v029.yml

permissions:
  contents: write

jobs:
  apply-port:
    runs-on: ubuntu-latest
    steps:
      - name: Check out migration branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply sampler shard trace wiring
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("vllm/v1/worker/gpu/model_runner.py")
          text = path.read_text(encoding="utf-8")

          def replace_once(old: str, new: str) -> None:
              global text
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"expected one match, found {count}: {old[:80]!r}")
              text = text.replace(old, new, 1)

          replace_once(
              """from vllm.v1.core.sched.model_runner_trace_event import (\n    make_model_runner_batch_event,\n)\n""",
              """from vllm.v1.core.sched.model_runner_trace_event import (\n    make_model_runner_batch_event,\n    make_sampler_batch_shard_event,\n)\n""",
          )

          replace_once(
              """        trace_writer = self.model_runner_trace_writer\n        if trace_writer is not None:\n            trace_writer.record(\n                make_model_runner_batch_event(\n                    step_id=getattr(scheduler_output, \"scheduler_trace_step_id\", 0),\n""",
              """        trace_writer = self.model_runner_trace_writer\n        trace_step_id = getattr(scheduler_output, \"scheduler_trace_step_id\", 0)\n        if trace_writer is not None:\n            setattr(input_batch, \"scheduler_trace_step_id\", trace_step_id)\n            trace_writer.record(\n                make_model_runner_batch_event(\n                    step_id=trace_step_id,\n""",
          )

          replace_once(
              """        return pcp.maybe_partition_pcp_batch(\n            self.pcp_manager,\n            input_batch,\n            padded_num_tokens=batch_desc.num_tokens,\n        )\n\n    def prepare_attn(\n""",
              """        prepared_batch = pcp.maybe_partition_pcp_batch(\n            self.pcp_manager,\n            input_batch,\n            padded_num_tokens=batch_desc.num_tokens,\n        )\n        if trace_writer is not None:\n            setattr(prepared_batch, \"scheduler_trace_step_id\", trace_step_id)\n        return prepared_batch\n\n    def prepare_attn(\n""",
          )

          replace_once(
              """            input_batch, sorted_logits_indices, grammar_output, shard_metadata = (\n                self.batch_sharder.shard_sampler_inputs(input_batch, grammar_output)\n            )\n            # The hidden states must be gathered in rank-owner-sorted order\n""",
              """            input_batch, sorted_logits_indices, grammar_output, shard_metadata = (\n                self.batch_sharder.shard_sampler_inputs(input_batch, grammar_output)\n            )\n            trace_writer = self.model_runner_trace_writer\n            if trace_writer is not None:\n                trace_writer.record(\n                    make_sampler_batch_shard_event(\n                        step_id=getattr(\n                            global_input_batch, \"scheduler_trace_step_id\", 0\n                        ),\n                        tp_rank=self.batch_sharder.tp_rank,\n                        tp_size=shard_metadata.tp_size,\n                        global_request_ids=global_input_batch.req_ids,\n                        global_persistent_rows=global_input_batch.idx_mapping_np,\n                        local_request_ids=input_batch.req_ids,\n                        local_persistent_rows=input_batch.idx_mapping_np,\n                        num_logits_per_rank=shard_metadata.num_logits_per_rank,\n                        num_local_logits=shard_metadata.num_local_logits,\n                        max_num_reqs_per_rank=shard_metadata.max_num_reqs_per_rank,\n                    )\n                )\n            # The hidden states must be gathered in rank-owner-sorted order\n""",
          )

          path.write_text(text, encoding="utf-8")
          PY

          git diff --check
          python -m py_compile \
            vllm/v1/core/sched/model_runner_trace_event.py \
            vllm/v1/worker/gpu/model_runner.py

      - name: Commit sampler shard wiring
        shell: bash
        run: |
          git config user.name "Xiaoda11"
          git config user.email "110323355+Xiaoda11@users.noreply.github.com"
          git add vllm/v1/worker/gpu/model_runner.py
          if ! git diff --cached --quiet; then
            git commit -m "port(trace): trace TP sampler shard ownership"
            git push origin HEAD:${GITHUB_REF_NAME}
          fi
