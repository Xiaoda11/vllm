name: apply-revocable-backfill-prototype

on:
  push:
    branches:
      - "test/pr33499-revocable-backfill-regression"
    paths:
      - ".github/workflows/apply-revocable-backfill-prototype.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Harden narrow revocable-backfill prototype
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("vllm/v1/core/sched/scheduler.py")
          text = path.read_text()

          old = '''                        and num_new_local_computed_tokens == 0\n                        and num_encoder_tokens == 0\n                    )\n'''
          new = '''                        and num_new_local_computed_tokens == 0\n                        and num_encoder_tokens == 0\n                        # Keep the prototype out of overlapping-batch paths.\n                        and self.vllm_config.max_concurrent_batches == 1\n                        # The reclaim accounting below is deliberately limited\n                        # to one KV group until hybrid-group semantics are\n                        # validated separately.\n                        and self.kv_cache_manager.num_kv_cache_groups == 1\n                    )\n'''
          assert old in text
          text = text.replace(old, new, 1)

          old = '''                                or backfill.has_encoder_inputs\n                                or backfill.lora_request is not None\n                            ):\n'''
          new = '''                                or backfill.has_encoder_inputs\n                                or backfill.lora_request is not None\n                                # Immediate retry of the protected head is only\n                                # correct if preemption returns this request's KV\n                                # blocks to the pool in the same scheduling step.\n                                or not self._request_blocks_can_be_freed(backfill)\n                            ):\n'''
          assert old in text
          text = text.replace(old, new, 1)

          marker = '''    def finish_requests(\n        self, request_ids: str | Iterable[str] | None, finished_status: RequestStatus\n    ) -> list[Request]:\n'''
          helper = '''    def _clear_kv_blocked_tracking(self, request_id: str) -> None:\n        """Remove a request from revocable-backfill bookkeeping."""\n        self._kv_blocked_bypass_counts.pop(request_id, None)\n        self._kv_blocked_backfill_ids.pop(request_id, None)\n        for blocked_id, backfill_ids in self._kv_blocked_backfill_ids.items():\n            if request_id in backfill_ids:\n                self._kv_blocked_backfill_ids[blocked_id] = [\n                    backfill_id\n                    for backfill_id in backfill_ids\n                    if backfill_id != request_id\n                ]\n\n    def finish_requests(\n        self, request_ids: str | Iterable[str] | None, finished_status: RequestStatus\n    ) -> list[Request]:\n'''
          assert marker in text
          text = text.replace(marker, helper, 1)

          old = '''            for removed_request in waiting_requests_to_remove:\n                removed_id = removed_request.request_id\n                self._kv_blocked_bypass_counts.pop(removed_id, None)\n                self._kv_blocked_backfill_ids.pop(removed_id, None)\n                for backfills in self._kv_blocked_backfill_ids.values():\n                    while removed_id in backfills:\n                        backfills.remove(removed_id)\n'''
          new = '''            for removed_request in waiting_requests_to_remove:\n                self._clear_kv_blocked_tracking(removed_request.request_id)\n'''
          assert old in text
          text = text.replace(old, new, 1)

          old = '''        self.encoder_cache_manager.free(request)\n        request_id = request.request_id\n        self.finished_req_ids.add(request_id)\n'''
          new = '''        self.encoder_cache_manager.free(request)\n        request_id = request.request_id\n        # A running backfill may finish through update_from_output() rather than\n        # finish_requests(); centralize cleanup here so no stale revocation\n        # candidate survives either completion path.\n        self._clear_kv_blocked_tracking(request_id)\n        self.finished_req_ids.add(request_id)\n'''
          assert old in text
          text = text.replace(old, new, 1)

          path.write_text(text)
          PY

          git config user.name "Xiaoda11"
          git config user.email "110323355+Xiaoda11@users.noreply.github.com"
          git add vllm/v1/core/sched/scheduler.py
          git commit -m "proto(scheduler): harden revocable backfill guards and cleanup"
          git push
