name: revocable-backfill-regression-cpu

on:
  push:
    branches:
      - "test/pr33499-revocable-backfill-regression"
  workflow_dispatch:

jobs:
  regression-cpu:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      VLLM_TARGET_DEVICE: cpu

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install CPU runtime dependencies
        run: |
          pipx install uv
          uv venv --python 3.12
          uv pip install \
            --index-strategy unsafe-best-match \
            --extra-index-url https://download.pytorch.org/whl/cpu \
            -r requirements/cpu.txt \
            pytest==9.1.1 \
            tblib

      - name: Run revocable-backfill regression
        run: >-
          .venv/bin/python -m pytest -q
          tests/v1/core/test_scheduler_revocable_backfill_regression.py

# Manual rerun checkpoint after applying the prototype scheduler patch.
