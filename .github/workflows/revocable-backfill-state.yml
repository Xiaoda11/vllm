name: Revocable backfill state test

on:
  push:
    branches:
      - exp/revocable-waiting-backfill

permissions:
  contents: read

jobs:
  state-invariants:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pytest
        run: python -m pip install pytest
      - name: Run policy-state invariants
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: python -m pytest tests/v1/core/test_revocable_backfill_state.py -q
