name: Revocable backfill state test

on:
  push:
    branches:
      - exp/revocable-waiting-backfill

permissions:
  contents: read

jobs:
  state-invariants:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.12'

      - name: Create virtual environment
        run: |
          uv venv
          echo "$GITHUB_WORKSPACE/.venv/bin" >> "$GITHUB_PATH"

      - name: Install vLLM CPU test dependencies
        run: |
          uv pip install -r requirements/test/cpu.txt --torch-backend cpu

      - name: Run policy-state invariants
        env:
          PYTHONPATH: ${{ github.workspace }}
          CUDA_VISIBLE_DEVICES: ""
          VLLM_TARGET_DEVICE: "cpu"
          VLLM_NO_USAGE_STATS: "1"
          VLLM_DO_NOT_TRACK: "1"
        run: python -m pytest tests/v1/core/test_revocable_backfill_state.py -q
