name: port-mrv2-worker-rank-v029

on:
  push:
    branches:
      - port/scheduler-trace-v029
    paths:
      - .github/workflows/port-mrv2-worker-rank-v029.yml

permissions:
  contents: write

jobs:
  apply-port:
    runs-on: ubuntu-latest
    steps:
      - name: Check out migration branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply process-safe MRV2 worker rank wiring
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("vllm/v1/worker/gpu/model_runner.py")
          text = path.read_text(encoding="utf-8")

          def replace_once(old: str, new: str) -> None:
              global text
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"expected one match, found {count}: {old[:100]!r}")
              text = text.replace(old, new, 1)

          replace_once(
              """from vllm.distributed.parallel_state import (\n    get_dcp_group,\n    get_pp_group,\n)\n""",
              """from vllm.distributed.parallel_state import (\n    get_dcp_group,\n    get_pp_group,\n    get_world_group,\n)\n""",
          )

          replace_once(
              """        self.model_runner_trace_writer = create_model_runner_trace_writer()\n\n        self.device = device\n""",
              """        self.model_runner_trace_writer = create_model_runner_trace_writer()\n        self.model_runner_trace_rank = (\n            get_world_group().rank\n            if self.model_runner_trace_writer is not None\n            else None\n        )\n\n        self.device = device\n""",
          )

          replace_once(
              """        if trace_writer is not None:\n            setattr(input_batch, \"scheduler_trace_step_id\", trace_step_id)\n            trace_writer.record(\n                make_model_runner_batch_event(\n                    step_id=trace_step_id,\n""",
              """        if trace_writer is not None:\n            trace_rank = self.model_runner_trace_rank\n            assert trace_rank is not None\n            setattr(input_batch, \"scheduler_trace_step_id\", trace_step_id)\n            trace_writer.record(\n                make_model_runner_batch_event(\n                    step_id=trace_step_id,\n                    worker_rank=trace_rank,\n""",
          )

          replace_once(
              """            if trace_writer is not None:\n                trace_writer.record(\n                    make_sampler_batch_shard_event(\n                        step_id=getattr(\n                            global_input_batch, \"scheduler_trace_step_id\", 0\n                        ),\n                        tp_rank=self.batch_sharder.tp_rank,\n""",
              """            if trace_writer is not None:\n                trace_rank = self.model_runner_trace_rank\n                assert trace_rank is not None\n                trace_writer.record(\n                    make_sampler_batch_shard_event(\n                        step_id=getattr(\n                            global_input_batch, \"scheduler_trace_step_id\", 0\n                        ),\n                        worker_rank=trace_rank,\n                        tp_rank=self.batch_sharder.tp_rank,\n""",
          )

          path.write_text(text, encoding="utf-8")
          PY

          git diff --check
          python -m py_compile \
            vllm/v1/core/sched/trace.py \
            vllm/v1/core/sched/model_runner_trace_event.py \
            vllm/v1/worker/gpu/model_runner.py

      - name: Commit worker-rank wiring
        shell: bash
        run: |
          git config user.name "Xiaoda11"
          git config user.email "110323355+Xiaoda11@users.noreply.github.com"
          git add vllm/v1/worker/gpu/model_runner.py
          if ! git diff --cached --quiet; then
            git commit -m "fix(trace): isolate and rank MRV2 worker traces"
            git push origin HEAD:${GITHUB_REF_NAME}
          fi
