name: Fairness boundary CPU test

on:
  push:
    branches:
      - test/pr33499-fairness-boundary

permissions:
  contents: read

jobs:
  fairness-boundary:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.12'
      - name: Create venv
        run: |
          uv venv
          echo "$GITHUB_WORKSPACE/.venv/bin" >> "$GITHUB_PATH"
      - name: Install runtime dependencies
        run: |
          uv pip install -r requirements/cpu.txt \
            --extra-index-url https://download.pytorch.org/whl/cpu \
            --index-strategy unsafe-best-match
      - name: Adapt PR patch to current waiting-queue names
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("vllm/v1/core/sched/scheduler.py")
          text = path.read_text()
          old = """                    request = self.waiting.pop_request()\n                    skipped_waiting_requests.prepend_request(request)\n                    continue\n"""
          new = """                    request = request_queue.pop_request()\n                    step_skipped_waiting.prepend_request(request)\n                    continue\n"""
          assert text.count(old) == 1, "expected the #33499 allocation-failure hunk once"
          path.write_text(text.replace(old, new))
          PY
      - name: Run deterministic scheduler cases directly
        env:
          PYTHONPATH: ${{ github.workspace }}
          CUDA_VISIBLE_DEVICES: ""
          VLLM_TARGET_DEVICE: "cpu"
          VLLM_NO_USAGE_STATS: "1"
          VLLM_DO_NOT_TRACK: "1"
        run: |
          python - <<'PY'
          from tests.v1.core.test_scheduler_kv_fairness import (
              test_retrying_blocked_head_first_does_not_prevent_extra_waiting,
              test_waiting_kv_blocked_request_does_not_block_lighter_request,
          )

          test_waiting_kv_blocked_request_does_not_block_lighter_request()
          test_retrying_blocked_head_first_does_not_prevent_extra_waiting()
          print("2 deterministic scheduler cases passed")
          PY
